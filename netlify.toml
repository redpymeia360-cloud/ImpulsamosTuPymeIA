# Guía rápida para publicar el portafolio en GitHub y Netlify

## 1. Subir a GitHub

1. Crea un repositorio llamado `portfolio-impulsamostupymeia`.
2. Sube todos los archivos de esta carpeta.
3. Asegúrate de que `index.html` quede en la raíz del repositorio.
4. Edita el README.md con tus enlaces reales.

## 2. Activar GitHub Pages

1. Entra al repositorio en GitHub.
2. Ve a Settings > Pages.
3. En Source, selecciona la rama `main`.
4. En Folder, selecciona `/root`.
5. Guarda y espera el enlace público.

URL esperada:
`https://TU_USUARIO.github.io/portfolio-impulsamostupymeia/`

## 3. Publicar en Netlify

1. Entra a Netlify.
2. Add new project > Import an existing project.
3. Conecta GitHub.
4. Selecciona el repositorio.
5. Build command: dejar vacío.
6. Publish directory: `.`
7. Deploy.

URL esperada:
`https://NOMBRE-DE-TU-SITIO.netlify.app`

## 4. Colocar en el CV

Sección recomendada:

**Portafolio online:** https://impulsamostupymeia.netlify.app  
**GitHub:** https://github.com/cberrios10/portfolio-impulsamostupymeia

## 5. Antes de enviar a clientes

- Cambiar correo y links reales.
- Revisar ortografía.
- Subir 2 o 3 capturas reales de proyectos WordPress.
- Agregar un botón de WhatsApp si quieres recibir consultas directas.
- No publicar contraseñas, tokens, claves API ni datos privados.
